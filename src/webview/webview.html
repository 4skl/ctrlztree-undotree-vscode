<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src %CSP_SOURCE%; style-src %CSP_SOURCE% 'unsafe-inline'; font-src %CSP_SOURCE%; img-src %CSP_SOURCE% data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CtrlZTree %TITLE%</title>
    <link rel="stylesheet" href="%STYLE_URI%">
    <script src="%VIS_NETWORK_URI%"></script>
</head>
<body>
    <div id="toolbar">
        <div id="toolbar-left">
            <span id="document-title" class="toolbar-title"></span>
        </div>
        <div id="toolbar-right">
            <input type="text" id="search-input" class="search-input" placeholder="Search nodes…" autocomplete="off" spellcheck="false">
            <button id="fit-button" class="toolbar-btn" title="Fit the complete tree in view">Fit</button>
            <button id="reset-btn" class="toolbar-btn" title="Reset Tree (Start Fresh from Current State)">Reset</button>
        </div>
    </div>
    <div id="tree-visualization">
        <button id="diff-button" title="Open the selected node's diff from its parent">📊 View Diff</button>
        <div id="status-bar" title="Head is the current editor state. Click a node to view its diff; double-click to restore that state.">Loading history…</div>
    </div>
    <script src="%SCRIPT_URI%"></script>
</body>
</html>
